name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'foundation/**'
      - 'simulation/**'
      - 'network/**'
      - 'multiplayer/**'

permissions:
  contents: read

concurrency:
  group: forged-moba-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-quality:
    name: Client quality + deterministic simulation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Architecture boundaries
        run: npm run lint:sim-boundaries

      - name: TypeScript
        run: npm run typecheck

      - name: Determinism suite
        run: npm run test:sim

      - name: Network client suite
        run: npm run test:network

      - name: Production build
        run: npm run build

  server-quality:
    name: Server typecheck + authoritative runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Server TypeScript
        run: npm run server:typecheck

      - name: Authoritative runner tests
        run: npm run server:test
