name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'foundation/**'
      - 'simulation/**'
      - 'network/**'
      - 'multiplayer/**'
      - 'content/**'
      - 'visual/**'

permissions:
  contents: read

concurrency:
  group: forged-moba-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-quality:
    name: Client quality + deterministic simulation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Export resolved root lockfile
        if: startsWith(github.ref, 'refs/heads/visual/')
        uses: actions/upload-artifact@v4
        with:
          name: resolved-root-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Architecture boundaries
        run: npm run lint:sim-boundaries

      - name: Visual authority boundaries
        run: npm run lint:visual-boundaries

      - name: TypeScript
        run: npm run typecheck

      - name: Determinism suite
        run: npm run test:sim

      - name: Network client suite
        run: npm run test:network

      - name: Visual unit suite
        run: npm run test:visual

      - name: Production build
        run: npm run build

      - name: Install Chromium for visual proof
        if: startsWith(github.ref, 'refs/heads/visual/') || startsWith(github.head_ref, 'visual/')
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture cinematic visual proof
        if: startsWith(github.ref, 'refs/heads/visual/') || startsWith(github.head_ref, 'visual/')
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/forged-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID || true" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,900"             --wait-for-timeout 3300             "http://127.0.0.1:4173/?visual-proof=cinematic"             visual-proof-cinematic.png

      - name: Upload cinematic visual proof
        if: startsWith(github.ref, 'refs/heads/visual/') || startsWith(github.head_ref, 'visual/')
        uses: actions/upload-artifact@v4
        with:
          name: visual-proof-cinematic
          path: visual-proof-cinematic.png
          if-no-files-found: error
          retention-days: 7

  server-quality:
    name: Server typecheck + authoritative runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Server TypeScript
        run: npm run server:typecheck

      - name: Authoritative runner tests
        run: npm run server:test

      - name: Five-v-five load probe
        working-directory: server
        run: npm run load:5v5
